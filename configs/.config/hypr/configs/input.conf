# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Bind the built-in Wacom stylus/pen to the laptop display so it
# doesn't span across external monitors (which causes coordinate offset).
# See https://wiki.hypr.land/Configuring/Tablets/
device {
    name = wacom-hid-5277-pen
    output = eDP-1
}

device {
    name = wacom-hid-5277-finger
    output = eDP-1
}
